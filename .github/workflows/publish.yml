name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      publish_sdk:
        description: "Publish @post2all/sdk"
        required: true
        type: boolean
        default: true
      publish_cli:
        description: "Publish @post2all/cli"
        required: true
        type: boolean
        default: true
      version_sdk:
        description: "Version bump for @post2all/sdk (e.g. patch, minor, 0.3.1). Leave blank to publish package.json version unchanged."
        required: false
        type: string
        default: ""
      version_cli:
        description: "Version bump for @post2all/cli (e.g. patch, minor, 0.3.1). Leave blank to publish package.json version unchanged."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  publish-sdk:
    if: inputs.publish_sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Validate SDK version input
        if: inputs.version_sdk != ''
        env:
          VERSION_INPUT: ${{ inputs.version_sdk }}
        run: |
          pattern='^(patch|minor|major|prepatch|preminor|premajor|prerelease|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'
          if [[ ! "$VERSION_INPUT" =~ $pattern ]]; then
            echo "::error::Invalid version_sdk input"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Bump SDK version and sync CLI dependency
        if: inputs.version_sdk != ''
        env:
          VERSION_INPUT: ${{ inputs.version_sdk }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm --filter @post2all/sdk exec npm version "$VERSION_INPUT" --no-git-tag-version
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          pnpm --filter @post2all/cli add "@post2all/sdk@workspace:^$VERSION"
          git add packages/sdk/package.json packages/cli/package.json pnpm-lock.yaml
          git commit -m "chore(sdk): bump to v$VERSION"
          git push

      - name: Build SDK
        run: pnpm --filter @post2all/sdk build

      - name: Publish @post2all/sdk
        run: pnpm --filter @post2all/sdk publish --access public --no-git-checks

  publish-cli:
    needs: publish-sdk
    if: always() && inputs.publish_cli && (needs.publish-sdk.result == 'success' || needs.publish-sdk.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Validate CLI version input
        if: inputs.version_cli != ''
        env:
          VERSION_INPUT: ${{ inputs.version_cli }}
        run: |
          pattern='^(patch|minor|major|prepatch|preminor|premajor|prerelease|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'
          if [[ ! "$VERSION_INPUT" =~ $pattern ]]; then
            echo "::error::Invalid version_cli input"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Bump version
        if: inputs.version_cli != ''
        env:
          VERSION_INPUT: ${{ inputs.version_cli }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm --filter @post2all/cli exec npm version "$VERSION_INPUT" --no-git-tag-version
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          git add packages/cli/package.json
          git commit -m "chore(cli): bump to v$VERSION"
          git push

      - name: Build SDK (workspace dep)
        run: pnpm --filter @post2all/sdk build

      - name: Build CLI
        run: pnpm --filter @post2all/cli build

      - name: Publish @post2all/cli
        run: pnpm --filter @post2all/cli publish --access public --no-git-checks
